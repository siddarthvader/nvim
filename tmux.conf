# ----------------------------- Plugins -----------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --------------------------- Continuum -----------------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'   # autosave every 15 min
set -g @plugin 'omerxx/tmux-sessionx'


# ----------------------------- Status ------------------------------
set -g status-style          "bg=colour46,fg=black"
set-window-option -g window-status-style         "fg=black,bg=colour46"
set-window-option -g window-status-current-style "fg=black,bg=colour118"

# -------------------------- Clipboard ------------------------------
# Tell tmux to use the system clipboard if it can (tmux ≥ 3.3)
set -s set-clipboard on

# Detect clipboard helper once and reuse it
if-shell 'command -v wl-copy >/dev/null' \
    "set -g @copycmd 'wl-copy'" \
    "set -g @copycmd 'xclip -selection clipboard -i'"

# Vim-like copy-mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@copycmd}"

# Mouse drag-copy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@copycmd}"

# put this anywhere after the @copycmd line
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "#{@copycmd}"
bind -T copy-mode     Enter send -X copy-pipe-and-cancel "#{@copycmd}"  # for emacs mode


# ------------------------- Popup shortcuts -------------------------
bind-key j     run-shell ',popup-tmux single'
bind-key M-j   run-shell ',popup-tmux master'
bind-key -n M-\; run-shell ',popup-tmux folder'

set -g @sessionx-bind 'Space'
set -g @sessionx-window-mode 'on'
set -g @sessionx-tree-mode 'on'
# ---------------------------- TPM ----------------------------------
run '~/.tmux/plugins/tpm/tpm'
